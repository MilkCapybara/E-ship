      max-lifetime: 1800000

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: 188043648@qq.com
    password: norhiozfabaobhie
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
