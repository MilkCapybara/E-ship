spring:
  application:
    name: E-ship

  # 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/eship?currentSchema=easyGo
    username: postgres
    password: sun2137405
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
